; PlatformIO Project Configuration File
; PlatformIO env upgraded from Arduino-ESP32 3.x to IDF 5.x update on 2025-12-23

[platformio]
description = RayPowerMeter — ESP32-S3 firmware
default_envs = esp32s3-debug
src_dir = firmware/app

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.partitions = partitions_raypowermeter_ota_16mb.csv

monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
monitor_speed = 115200
;monitor_filters = esp32_exception_decoder, time, colorize
monitor_filters = time

build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D CORE_DEBUG_LEVEL=1
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D APP_VERSION=\"0.1.0\"
  -D APP_NAME=\"RayPowerMeter\"
  -D CONFIG_ADC_CONTINUOUS_FORCE_USE_ADC1=1 ; Force ADC1 for continuous mode (needed for Spectrum Analyzer 20 kHz)

lib_ldf_mode = chain
lib_deps =
  bblanchon/ArduinoJson @ 7.4.2
  esp32async/AsyncTCP @ 3.4.9
  esp32async/ESPAsyncWebServer @ 3.9.3

[env:esp32s3-debug]
build_type = debug
build_flags = ${env.build_flags} 
  -D DEBUG=1
  -D AUXDIGITAL_DEV_DISABLE_UART0=0 ; Disable UART0 for Aux Digital Input device to free up pins for other uses

[env:esp32s3-release]
build_type = release
build_flags = ${env.build_flags} 
  -D DEBUG=0
  -D AUXDIGITAL_DEV_DISABLE_UART0=1 ; Disable UART0 for Aux Digital Input device to free up pins for other uses

; Explicit opt-in for the historical unauthenticated HTTP API on an isolated LAN.
[env:esp32s3-lab-network]
extends = env:esp32s3-release
build_flags =
  ${env:esp32s3-release.build_flags}
  -D RAYPM_ENABLE_LAB_NETWORK=1
